<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#x25C6;</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    .confirmation {
      text-align: center;
      font-style: italic;
      color: var(--dim);
      font-size: 0.9rem;
      line-height: 2;
    }
    .confirmation em {
      color: var(--accent);
      font-style: normal;
    }
    .return-link {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      text-align: center;
      display: block;
      margin-top: 1rem;
      transition: color 0.2s;
    }
    .return-link:hover { color: var(--ink); }
    #burst-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<canvas id="burst-canvas"></canvas>

<main class="page">

  <img class="sigil" id="sigil" src="../../sigil.svg" alt="" style="opacity:0;">

  <hr class="rule" id="el-1" style="opacity:0;">

  <p class="flavor" id="el-2" style="opacity:0;">
    [PLACEHOLDER — Location 5 flavor text. The Order speaks about this place. Do not describe it plainly. Invoke what it holds or what it witnesses.]
  </p>

  <hr class="rule" id="el-3" style="opacity:0;">

  <p class="confirmation" id="el-4" style="opacity:0;">
    The <em>Fifth Seal</em> is broken.<br>
    Record your fragment. Return to the rove.
  </p>

  <a class="return-link" id="el-5" href="../../" style="opacity:0;">&#x2190; Return to the Six Seals</a>

  <hr class="rule" id="el-6" style="opacity:0;">

  <div class="fragment" id="el-7" style="opacity:0;">
    <span class="fragment-label">Seal 5 of 6</span>
    <div class="fragment-code">[XX]</div>
  </div>

</main>

<script>
  document.cookie = "location_5=found; path=/; max-age=" + (60 * 60 * 24 * 365);

  function fadeIn(id, duration, targetOpacity) {
    var el = document.getElementById(id);
    if (!el) return;
    var op = parseFloat(el.style.opacity) || 0;
    var target = targetOpacity || 1;
    var step = (target - op) / (duration / 16);
    var timer = setInterval(function() {
      op += step;
      if (op >= target) { op = target; clearInterval(timer); }
      el.style.opacity = op;
    }, 16);
  }

  function fireBurst() {
    var canvas = document.getElementById('burst-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    var cx = canvas.width  / 2;
    var cy = canvas.height / 2;
    var rings = [
      { r: 0, maxR: Math.max(canvas.width, canvas.height) * 0.9, speed: 5.5, alpha: 0.55, width: 2.5 },
      { r: 0, maxR: Math.max(canvas.width, canvas.height) * 0.7, speed: 3.8, alpha: 0.35, width: 1.5 },
      { r: 0, maxR: Math.max(canvas.width, canvas.height) * 0.5, speed: 2.5, alpha: 0.20, width: 1.0 }
    ];
    var bloom = { alpha: 0.45 };
    var start = null;
    function draw(ts) {
      if (!start) start = ts;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (bloom.alpha > 0) {
        var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
        grad.addColorStop(0,   'rgba(255,210,80,' + bloom.alpha + ')');
        grad.addColorStop(0.4, 'rgba(200,146,42,' + (bloom.alpha * 0.6) + ')');
        grad.addColorStop(1,   'rgba(200,146,42,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        bloom.alpha -= 0.018;
      }
      var allDone = true;
      rings.forEach(function(ring) {
        ring.r += ring.speed;
        var progress = ring.r / ring.maxR;
        var alpha = ring.alpha * (1 - progress);
        if (alpha > 0.001) {
          allDone = false;
          ctx.beginPath();
          ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(200,146,42,' + alpha + ')';
          ctx.lineWidth = ring.width;
          ctx.stroke();
        }
      });
      if (!allDone || bloom.alpha > 0) {
        requestAnimationFrame(draw);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    requestAnimationFrame(draw);
  }

  setTimeout(function() { fireBurst(); },                     80);
  setTimeout(function() { fadeIn('sigil', 2000, 0.9); },     300);
  setTimeout(function() { fadeIn('el-1',  800); },           2400);
  setTimeout(function() { fadeIn('el-2',  1200); },          2700);
  setTimeout(function() { fadeIn('el-3',  800); },           3200);
  setTimeout(function() { fadeIn('el-4',  1200); },          3400);
  setTimeout(function() { fadeIn('el-5',  1000); },          3800);
  setTimeout(function() { fadeIn('el-6',  800); },           4000);
  setTimeout(function() { fadeIn('el-7',  1200); },          4200);

  setTimeout(function() {
    for (var i = 1; i <= 7; i++) {
      var el = document.getElementById('el-' + i);
      if (el) el.style.opacity = 1;
    }
    var s = document.getElementById('sigil');
    if (s) s.style.opacity = 0.9;
  }, 8000);
</script>

</body>
</html>
