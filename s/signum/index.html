<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#x25C6;</title>
  <link rel="stylesheet" href="../../style.css">
  <style>
    .confirmation {
      text-align: center;
      font-style: italic;
      color: var(--dim);
      font-size: 0.9rem;
      line-height: 2;
    }
    .confirmation em { color: var(--accent); font-style: normal; }
    .return-link {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      text-align: center;
      display: block;
      margin-top: 1rem;
      transition: color 0.2s;
    }
    .return-link:hover { color: var(--ink); }

    /* Big letter reveal */
    .seal-letter {
      text-align: center;
      font-size: 6rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      line-height: 1;
      margin: 0.5rem 0;
    }
    .seal-letter-label {
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--dim);
      text-align: center;
      display: block;
      margin-bottom: 0.5rem;
    }

    /* Admo trivia */
    .trivia {
      text-align: center;
      font-size: 0.82rem;
      color: var(--dim);
      line-height: 1.8;
      font-style: italic;
      border-top: 1px solid rgba(107,100,82,0.25);
      padding-top: 1.5rem;
    }
    .trivia-label {
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--dim);
      display: block;
      margin-bottom: 0.75rem;
      font-style: normal;
    }

    #burst-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<canvas id="burst-canvas"></canvas>

<main class="page">

  <div style="display:flex; flex-direction:column; align-items:center; gap:0; width:100%;">
    <img class="sigil" id="sigil" src="../../THE_SEAL.png" alt="" style="opacity:0; mix-blend-mode:screen; width:auto; max-width:300px; height:auto; display:block;">
    <img id="wordmark-img" src="../../ROVE_54_TYPEFACE_LOGO.png" alt="Rove 54" style="opacity:0; mix-blend-mode:screen; width:auto; max-width:300px; height:auto; display:block; margin-top:-0.75rem;">
  </div>
  <hr class="rule" id="el-1" style="opacity:0;">

  <!-- Flavor text -->
  <p class="flavor" id="el-4" style="opacity:0;">
    [PLACEHOLDER — Location 6 flavor text. The Order speaks about this place.]
  </p>

  <hr class="rule" id="el-5" style="opacity:0;">

  <!-- Confirmation -->
  <p class="confirmation" id="el-6" style="opacity:0;">
    The <em>Sixth Seal</em> is broken.<br>
    All seals have been recorded.<br>
    Forwarding to your progress page&hellip;
  </p>

</main>

<script>
  var firstBreak = document.cookie.indexOf("signum=found") === -1;
  document.cookie = "signum=found; path=/; max-age=" + (60 * 60 * 24 * 365);
  /* Coordinates of the chest — written as cookies so the complete page can display them.
     EDIT THESE VALUES to match the LAT/LON shown below. */
  document.cookie = "signum_lat=38.9213530; path=/; max-age=" + (60 * 60 * 24 * 365);
  document.cookie = "signum_lon=-77.0485810; path=/; max-age=" + (60 * 60 * 24 * 365);


  /* ---- TAP EVENT LOG ---- */
  /* Fires a GoatCounter event only on FIRST break of this seal on this device.
     Shows up in the dashboard as a path like "seal-1-first-break" with timestamp. */
  function logEvent(name) {
    var tries = 0;
    var t = setInterval(function() {
      tries++;
      if (window.goatcounter && window.goatcounter.count) {
        clearInterval(t);
        window.goatcounter.count({ path: name, title: name, event: true });
      } else if (tries > 50) {
        clearInterval(t);
      }
    }, 100);
  }

  if (firstBreak) { logEvent("seal-6-first-break"); }

  function fadeIn(id, duration, targetOpacity) {
    var el = document.getElementById(id);
    if (!el) return;
    var op = parseFloat(el.style.opacity) || 0;
    var target = targetOpacity || 1;
    var step = (target - op) / (duration / 16);
    var timer = setInterval(function() {
      op += step;
      if (op >= target) { op = target; clearInterval(timer); }
      el.style.opacity = op;
    }, 16);
  }

  function fireBurst() {
    var canvas = document.getElementById('burst-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    var cx = canvas.width / 2;
    var cy = canvas.height / 2;
    var rings = [
      { r: 0, maxR: Math.max(canvas.width, canvas.height) * 0.9, speed: 5.5, alpha: 0.55, width: 2.5 },
      { r: 0, maxR: Math.max(canvas.width, canvas.height) * 0.7, speed: 3.8, alpha: 0.35, width: 1.5 },
      { r: 0, maxR: Math.max(canvas.width, canvas.height) * 0.5, speed: 2.5, alpha: 0.20, width: 1.0 }
    ];
    var bloom = { alpha: 0.45 };
    var start = null;
    function draw(ts) {
      if (!start) start = ts;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (bloom.alpha > 0) {
        var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
        grad.addColorStop(0,   'rgba(255,210,80,' + bloom.alpha + ')');
        grad.addColorStop(0.4, 'rgba(200,146,42,' + (bloom.alpha * 0.6) + ')');
        grad.addColorStop(1,   'rgba(200,146,42,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        bloom.alpha -= 0.018;
      }
      var allDone = true;
      rings.forEach(function(ring) {
        ring.r += ring.speed;
        var alpha = ring.alpha * (1 - ring.r / ring.maxR);
        if (alpha > 0.001) {
          allDone = false;
          ctx.beginPath();
          ctx.arc(cx, cy, ring.r, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(200,146,42,' + alpha + ')';
          ctx.lineWidth = ring.width;
          ctx.stroke();
        }
      });
      if (!allDone || bloom.alpha > 0) requestAnimationFrame(draw);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(draw);
  }

  function fireVibration() {
    try { if (navigator.vibrate) navigator.vibrate([80, 40, 120]); } catch(e) {}
  }

  function fireTone() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = new AC();
      var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
      o1.type = o2.type = 'sine';
      o1.frequency.setValueAtTime(80, ctx.currentTime);
      o2.frequency.setValueAtTime(81.2, ctx.currentTime);
      g.gain.setValueAtTime(0, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.3);
      g.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 1.2);
      g.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.0);
      o1.connect(g); o2.connect(g); g.connect(ctx.destination);
      o1.start(); o2.start();
      o1.stop(ctx.currentTime + 3.1); o2.stop(ctx.currentTime + 3.1);
    } catch(e) {}
  }

  /* ---- TIMELINE — faster than before ---- */
  setTimeout(function() { fireBurst(); fireVibration(); fireTone(); }, 80);
  setTimeout(function() { fadeIn('sigil', 1200, 0.9); fadeIn('wordmark-img', 1200, 1); },   200);
  setTimeout(function() { fadeIn('el-1',  600); },         1000);
  setTimeout(function() { fadeIn('el-4',  900); },         1900);
  setTimeout(function() { fadeIn('el-5',  600); },         2500);
  setTimeout(function() { fadeIn('el-6',  900); },         2700);
  setTimeout(function() { fadeIn('el-7', 1400); },         3200);
  setTimeout(function() { fadeIn('el-8',  700); },         3800);

  /* Auto-redirect to complete page after seals are recorded */
  setTimeout(function() {
    window.location.href = '../../complete/';
  }, 3500);

  /* Fallback */
  setTimeout(function() {
    for (var i = 1; i <= 8; i++) {
      var el = document.getElementById('el-' + i);
      if (el) el.style.opacity = 1;
    }
    var s = document.getElementById('sigil');
    if (s) s.style.opacity = 0.9;
    var w = document.getElementById('wordmark-img');
    if (w) w.style.opacity = 1;
  }, 7000);
</script>


<script data-goatcounter="https://tristanmisten.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
